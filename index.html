<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Health Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Link Health Checker</h1>
        <p>Enter a website URL to check its links.</p>

        <form id="check-form">
            <input id="url-input" type="url" placeholder="https://example.com" required>
            <button type="submit">Check Links</button>
        </form>

        <div id="filter-controls"></div>

        <div id="results"></div>
    </main>
    <script src="app.js"></script>
</body>
</html>
